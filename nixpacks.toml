[phases.setup]
nixPkgs = ["nodejs_20", "dotnet-sdk_8"]

[phases.install]
cmds = ["cd optiflujo-web && npm ci"]

[phases.build]
cmds = [
  "cd optiflujo-web && npm run build",
  "rm -rf OptiFlujo.Api/wwwroot && mkdir -p OptiFlujo.Api/wwwroot",
  "cp -r optiflujo-web/dist/. OptiFlujo.Api/wwwroot/",
  "dotnet publish OptiFlujo.Api/OptiFlujo.Api.csproj -c Release -o /app/publish"
]

[start]
cmd = "dotnet /app/publish/OptiFlujo.Api.dll"